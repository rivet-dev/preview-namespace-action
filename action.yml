name: 'Rivet Preview Namespace'
description: 'Automatically create Rivet namespaces for preview deployments'
author: 'Rivet'
branding:
  icon: 'server'
  color: 'orange'

inputs:
  platform:
    description: 'Deployment platform (currently only "vercel" is supported)'
    required: true
  rivet-token:
    description: 'Rivet Cloud API token'
    required: true
  vercel-token:
    description: 'Vercel API token (required when platform is "vercel")'
    required: false
  rivet-endpoint:
    description: 'Rivet Engine API endpoint'
    required: false
    default: 'https://api.rivet.dev'
  github-token:
    description: 'GitHub token for PR comments'
    required: false
    default: ${{ github.token }}
  main-branch:
    description: 'Main branch name for production deployments'
    required: false
    default: 'main'
  runner-config:
    description: |
      JSON object to override runner configuration. Passed directly to the Rivet API.
      See https://rivet.dev/docs/connect/freestyle#configure-runner for available options.

      Example for private Vercel deployments with auth bypass:
      runner-config: '{"headers": {"x-vercel-protection-bypass": "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}"}}'
    required: false
    default: '{}'

runs:
  using: 'composite'
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Setup Rivet Preview
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        RIVET_CLOUD_TOKEN: ${{ inputs.rivet-token }}
        RIVET_ENGINE_ENDPOINT: ${{ inputs.rivet-endpoint }}
        PLATFORM: ${{ inputs.platform }}
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        REPO_FULL_NAME: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        MAIN_BRANCH: ${{ inputs.main-branch }}
        RUNNER_CONFIG: ${{ inputs.runner-config }}
      run: bun run ${{ github.action_path }}/src/index.ts
