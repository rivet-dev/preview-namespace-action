name: 'Rivet Vercel Preview'
description: 'Automatically create Rivet namespaces for Vercel preview deployments'
author: 'Rivet'
branding:
  icon: 'server'
  color: 'orange'

inputs:
  rivet-token:
    description: 'Rivet Cloud API token'
    required: true
  vercel-token:
    description: 'Vercel API token'
    required: true
  rivet-endpoint:
    description: 'Rivet Engine API endpoint'
    required: false
    default: 'https://api.rivet.dev'
  github-token:
    description: 'GitHub token for PR comments'
    required: false
    default: ${{ github.token }}
  main-branch:
    description: 'Main branch name for production deployments'
    required: false
    default: 'main'
  runner-config:
    description: |
      JSON object to override runner configuration. Available options:
      - max_runners: Maximum concurrent runners (default: 100000)
      - min_runners: Minimum runners to keep warm (default: 0)
      - request_lifespan: Request timeout in seconds (default: 270)
      - slots_per_runner: Slots per runner instance (default: 1)
      - runners_margin: Runner margin for scaling (default: 0)
      - headers: Custom headers for Vercel requests (useful for auth bypass)

      Example for private Vercel deployments with auth bypass:
      runner-config: '{"headers": {"x-vercel-protection-bypass": "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}"}}'
    required: false
    default: '{}'

runs:
  using: 'composite'
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Setup Rivet Preview
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        RIVET_CLOUD_TOKEN: ${{ inputs.rivet-token }}
        RIVET_ENGINE_ENDPOINT: ${{ inputs.rivet-endpoint }}
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        REPO_FULL_NAME: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        MAIN_BRANCH: ${{ inputs.main-branch }}
        RUNNER_CONFIG: ${{ inputs.runner-config }}
      run: bun run ${{ github.action_path }}/src/index.ts
